<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <radialGradient id="drumGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Drum Body Shell -->
  <g filter="url(#shadow)">
    <!-- Main Circle (Drum Head) -->
    <ellipse cx="256" cy="230" rx="150" ry="85" fill="url(#drumGlow)" stroke="url(#goldGrad)" stroke-width="12"/>
    
    <!-- Drum Shell (Surdo/Repique) -->
    <path d="M 106,230 L 106,350 C 106,410 406,410 406,350 L 406,230 C 406,290 106,290 106,230 Z" fill="#141926" stroke="url(#goldGrad)" stroke-width="10"/>

    <!-- Tension Rods (Tirantes do Surdo/Repique) -->
    <line x1="140" y1="270" x2="140" y2="370" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="285" x2="200" y2="385" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="290" x2="256" y2="390" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <line x1="312" y1="285" x2="312" y2="385" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="372" y1="270" x2="372" y2="370" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Drum Sticks (Baquetas de Samba cruzadas) -->
    <g transform="rotate(-30 256 210)">
      <rect x="246" y="80" width="20" height="260" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
      <circle cx="256" cy="85" r="18" fill="url(#bgGrad)"/>
    </g>
    <g transform="rotate(30 256 210)">
      <rect x="246" y="80" width="20" height="260" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
      <circle cx="256" cy="85" r="18" fill="url(#bgGrad)"/>
    </g>
  </g>

  <!-- Accent Brazilian Samba Star & Rhythm waves -->
  <path d="M 256,415 L 263,435 L 284,435 L 267,447 L 273,467 L 256,454 L 239,467 L 245,447 L 228,435 L 249,435 Z" fill="#fde047"/>
</svg>
